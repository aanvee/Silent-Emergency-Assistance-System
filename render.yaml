services:
  - type: web
    name: silent-emergency-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: PORT
        value: 8000
