<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual POV Demo</title>
<style>
  body, html { margin: 0; padding: 0; height: 100%; display: flex; font-family: sans-serif; background: #000; overflow: hidden; }
  .half { flex: 1; display: flex; flex-direction: column; position: relative; }
  iframe { flex: 1; border: none; width: 100%; height: 100%; }
  .divider { width: 4px; background: #fff; z-index: 10; border-left: 2px solid #555; }
  .label { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); color: #fff; padding: 5px 15px; border-radius: 8px; font-weight: bold; border: 1px solid #333; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; pointer-events: none;}
</style>
</head>
<body>

  <div class="half">
     <div class="label">SENDER POV (localhost)</div>
     <iframe src="http://localhost:3001/"></iframe>
  </div>

  <div class="divider"></div>

  <div class="half">
     <div class="label">RECEIVER POV (127.0.0.1)</div>
     <iframe src="http://127.0.0.1:3001/"></iframe>
  </div>

</body>
</html>
